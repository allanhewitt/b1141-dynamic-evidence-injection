name: DEI Stage 4 acceptance

on:
  push:
    branches:
      - stage4-dei-instance-configuration
  pull_request:
    branches:
      - stage3-dei-public-alias-routing-fix

jobs:
  stage4-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dei
          POSTGRES_USER: dei
          POSTGRES_PASSWORD: acceptance-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dei -d dei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STORAGE: postgres
      DATABASE_URL: postgres://dei:acceptance-only@127.0.0.1:5432/dei
      DEI_LECTURER_KEY: acceptance-key
      DEI_PARTICIPANT_SALT: acceptance-salt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production and acceptance dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: Check source syntax
        run: npm run check
      - name: Run complete non-PostgreSQL test suite
        env:
          STORAGE: sqlite
        run: npm test
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if npm_config_fetch_timeout=30000 npm_config_fetch_retries=0 npm audit --omit=dev; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Apply accepted Stage 3 PostgreSQL schema
        run: PGPASSWORD=acceptance-only psql -h 127.0.0.1 -U dei -d dei -v ON_ERROR_STOP=1 -f backend/migrations/001_dei_stage3_architecture.sql
      - name: Simulate retained inactive Stage 3 validation row
        run: |
          PGPASSWORD=acceptance-only psql -h 127.0.0.1 -U dei -d dei -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO activities (id,title,model,schema_version,active,config)
          VALUES ('b1141-w9-disclosure-sequence-dei','The Disclosure Sequence','dei',1,false,'{}'::jsonb);
          SQL
      - name: Apply guarded Stage 4 B1141 configuration
        run: PGPASSWORD=acceptance-only psql -h 127.0.0.1 -U dei -d dei -v ON_ERROR_STOP=1 -f backend/migrations/002_dei_stage4_b1141_configuration.sql
      - name: Verify canonical configuration and validation-row retention
        run: |
          PGPASSWORD=acceptance-only psql -h 127.0.0.1 -U dei -d dei -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/dei-stage4.txt
          SELECT 'canonical_count=' || COUNT(*) FROM activities WHERE id IN ('b1141-w2-who-dopes-dei','b1141-w8-disclosure-sequence-dei') AND model='dei';
          SELECT 'canonical_active=' || COUNT(*) FROM activities WHERE id IN ('b1141-w2-who-dopes-dei','b1141-w8-disclosure-sequence-dei') AND model='dei' AND active;
          SELECT 'old_validation_inactive=' || COUNT(*) FROM activities WHERE id='b1141-w9-disclosure-sequence-dei' AND model='dei' AND active=false;
          SELECT 'dei02_title=' || title FROM activities WHERE id='b1141-w8-disclosure-sequence-dei';
          SELECT 'dei01_heading=' || (config->'results'->>'heading') FROM activities WHERE id='b1141-w2-who-dopes-dei';
          SQL
          cat /tmp/dei-stage4.txt
          grep -qx 'canonical_count=2' /tmp/dei-stage4.txt
          grep -qx 'canonical_active=0' /tmp/dei-stage4.txt
          grep -qx 'old_validation_inactive=1' /tmp/dei-stage4.txt
          grep -qx 'dei02_title=A Club Responds' /tmp/dei-stage4.txt
          grep -qx 'dei01_heading=What changed — if anything?' /tmp/dei-stage4.txt
      - name: Run PostgreSQL full-stack acceptance
        run: node --test tests/postgres-http-acceptance.test.mjs
