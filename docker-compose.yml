services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dei
      POSTGRES_USER: dei
      POSTGRES_PASSWORD: local-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dei -d dei"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://dei:local-only-change-me@db:5432/dei
      DEI_LECTURER_KEY: local-only-change-me
      DEI_PARTICIPANT_SALT: local-only-change-me-too
    ports:
      - "3000:3000"
